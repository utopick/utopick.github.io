// Learn.Pocket: the music theory, as plain functions (no DOM, no audio). index.html inlines this file in <script id="theory">; tests/theory.test.js runs it in Node.
const LearnTheory = (() => {
  const SHARP = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
  const FLAT = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];
  const MODES = {
    major: { name: "Major", iv: [0, 2, 4, 5, 7, 9, 11], feel: "bright, settled" },
    minor: { name: "Minor", iv: [0, 2, 3, 5, 7, 8, 10], feel: "darker, sadder" },
    dorian: { name: "Dorian", iv: [0, 2, 3, 5, 7, 9, 10], feel: "minor with a lift, jazzy and funky" },
    mixolydian: { name: "Mixolydian", iv: [0, 2, 4, 5, 7, 9, 10], feel: "major with a bluesy edge" },
  };
  const FLAT_MAJOR = new Set([5, 10, 3, 8, 1, 6]); // F Bb Eb Ab Db Gb are spelled with flats
  const FLAT_MINOR = new Set([2, 7, 0, 5, 10, 3]); // Dm Gm Cm Fm Bbm Ebm
  const flatsFor = (key, mode) => (mode === "minor" || mode === "dorian" ? FLAT_MINOR : FLAT_MAJOR).has(((key % 12) + 12) % 12);
  const noteName = (pc, flats) => (flats ? FLAT : SHARP)[((pc % 12) + 12) % 12];
  const scalePcs = (key, mode) => MODES[mode].iv.map((i) => (key + i) % 12);
  const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];
  const SUFFIX = { major: "", minor: "m", dim: "°", aug: "+", maj7: "maj7", "7": "7", m7: "m7", m7b5: "m7♭5", dim7: "°7", mMaj7: "m(maj7)" };
  const ROMAN_SUF = { major: "", minor: "", dim: "°", aug: "+", maj7: "maj7", "7": "7", m7: "7", m7b5: "ø7", dim7: "°7", mMaj7: "(maj7)" };
  const LOWER = new Set(["minor", "dim", "m7", "m7b5", "dim7", "mMaj7"]);
  // what a chord does in a key (the three families every progression is made of)
  const FUNCTION = { 0: "home", 5: "home", 2: "home", 1: "away", 3: "away", 4: "tension", 6: "tension" };

  // a chord built on a degree (0 to 6) of a key and mode. flavour: "t" triad, "7" the seventh chord of the scale, "d" a dominant seventh (blues, turnarounds)
  function chord(key, mode, deg, flavour = "t") {
    const s = scalePcs(key, mode), flats = flatsFor(key, mode), root = s[deg % 7];
    let ints;
    if (flavour === "d") ints = [0, 4, 7, 10];
    else ints = Array.from({ length: flavour === "7" ? 4 : 3 }, (_, k) => (s[(deg + 2 * k) % 7] - root + 12) % 12);
    const [, third, fifth, seventh] = ints;
    const base = third === 4 && fifth === 7 ? "major" : third === 3 && fifth === 7 ? "minor" : third === 3 && fifth === 6 ? "dim" : "aug";
    let quality = base;
    if (ints.length === 4) quality = base === "major" ? (seventh === 11 ? "maj7" : "7") : base === "minor" ? (seventh === 11 ? "mMaj7" : "m7") : base === "dim" ? (seventh === 9 ? "dim7" : "m7b5") : "7";
    const numeral = (LOWER.has(quality) ? ROMAN[deg % 7].toLowerCase() : ROMAN[deg % 7]) + ROMAN_SUF[quality];
    return { deg, flavour, root, ints, quality, name: noteName(root, flats) + SUFFIX[quality], roman: numeral, pcs: ints.map((i) => (root + i) % 12), fn: FUNCTION[deg % 7] };
  }

  // the notes of a chord as a close voicing near the middle of the keyboard, the nearest to the chord before it (voice leading: the hand barely moves)
  function voice(prev, pcs, lo = 53, hi = 76) {
    const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    let best = null;
    for (let r = 0; r < pcs.length; r++) {
      const order = pcs.slice(r).concat(pcs.slice(0, r));
      for (let base = lo; base < lo + 12; base++) {
        if (base % 12 !== order[0]) continue;
        const notes = [base];
        for (let k = 1; k < order.length; k++) { let n = notes[k - 1] + 1; while (n % 12 !== order[k]) n++; notes.push(n); }
        if (notes[notes.length - 1] > hi) continue;
        const cost = prev ? Math.abs(mean(notes) - mean(prev)) : Math.abs(mean(notes) - 62);
        if (!best || cost < best.cost) best = { notes, cost };
      }
    }
    return best ? best.notes : pcs.map((p) => 60 + ((p - 60 + 1200) % 12));
  }
  const bassNote = (ch, octave = 2) => 12 * (octave + 1) + ch.root; // C2 = 36
  const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // ---- a tune as notes in beats, the same for the player and for the MIDI file
  // genre.pat: { kick, snare, hat, bass, comp } strings of 16 steps (a bar of sixteenth notes). Kick/snare/hat: x hit, o open, g ghost. Bass: r root, 5 fifth, o octave, 3 third, 6 sixth.
  // Comp: a digit holds the chord that many steps, h = 8, p = whole bar, s = short stab.
  function arrange(tune, genre) {
    const flav = tune.degrees, chords = flav.map((d) => chord(tune.key, tune.mode, d.deg, d.flavour));
    const parts = { chords: [], bass: [], kick: [], snare: [], hat: [], melody: [] };
    let prev = null;
    chords.forEach((ch, bar) => {
      // block: the whole chord; power: root and fifth; shell: the third and the seventh (jazz comping)
      const pcs = genre.comp === "power" ? [ch.pcs[0], ch.pcs[2]] : genre.comp === "shell" ? [ch.pcs[1], ch.pcs[3] ?? ch.pcs[2]] : ch.pcs;
      const notes = voice(prev, pcs);
      prev = notes;
      const p = genre.pat;
      for (let s = 0; s < 16; s++) {
        const beat = bar * 4 + s / 4, c = p.comp[s];
        if (c && c !== ".") {
          const len = c === "p" ? 16 : c === "h" ? 8 : c === "s" ? 1.2 : Number(c);
          parts.chords.push({ beat, dur: len / 4, notes, vel: c === "s" ? 0.7 : 0.85 });
        }
        const b = p.bass[s];
        if (b && b !== ".") {
          const off = b === "r" ? 0 : b === "5" ? 7 : b === "o" ? 12 : b === "3" ? ch.ints[1] : b === "6" ? 9 : 0;
          parts.bass.push({ beat, dur: 0.45, note: bassNote(ch) + off, vel: 0.9 });
        }
        for (const [k, name] of [["kick", "kick"], ["snare", "snare"], ["hat", "hat"]]) {
          const d = p[k][s];
          if (d && d !== ".") parts[name].push({ beat, dur: 0.1, vel: d === "g" ? 0.35 : 0.9, open: d === "o" });
        }
      }
    });
    return { bars: chords.length, chords: chords, parts };
  }

  // ---- a standard MIDI file (type 1): tracks of { name, channel, program, notes: [{ beat, dur, note, vel }] }; drums go on channel 9
  function midiFile({ tempo, tracks }) {
    const PPQ = 480, out = [], u32 = (n) => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255], u16 = (n) => [(n >> 8) & 255, n & 255];
    const vl = (n) => { const b = [n & 127]; while ((n >>= 7)) b.unshift((n & 127) | 128); return b; };
    const trk = (events) => {
      events.sort((a, b) => a.t - b.t || a.order - b.order);
      const body = []; let last = 0;
      for (const e of events) { body.push(...vl(e.t - last), ...e.bytes); last = e.t; }
      body.push(0, 0xff, 0x2f, 0);
      return [0x4d, 0x54, 0x72, 0x6b, ...u32(body.length), ...body];
    };
    const meta = [{ t: 0, order: 0, bytes: [0xff, 0x51, 3, ...u32(Math.round(60000000 / tempo)).slice(1)] }, { t: 0, order: 0, bytes: [0xff, 0x58, 4, 4, 2, 24, 8] }];
    const chunks = [trk(meta)];
    for (const t of tracks) {
      const ev = [];
      const nm = Array.from(t.name || "track").map((c) => c.charCodeAt(0) & 127);
      ev.push({ t: 0, order: 0, bytes: [0xff, 0x03, nm.length, ...nm] });
      if (t.channel !== 9) ev.push({ t: 0, order: 1, bytes: [0xc0 | t.channel, t.program || 0] });
      for (const n of t.notes) {
        const on = Math.round(n.beat * PPQ), off = on + Math.max(1, Math.round(n.dur * PPQ)), v = Math.max(1, Math.min(127, Math.round((n.vel ?? 0.8) * 127)));
        ev.push({ t: on, order: 3, bytes: [0x90 | t.channel, n.note & 127, v] }, { t: off, order: 2, bytes: [0x80 | t.channel, n.note & 127, 0] });
      }
      chunks.push(trk(ev));
    }
    out.push(0x4d, 0x54, 0x68, 0x64, ...u32(6), ...u16(1), ...u16(chunks.length), ...u16(PPQ));
    for (const c of chunks) out.push(...c);
    return Uint8Array.from(out);
  }

  // how a melody sits on the chords: share in the scale, and chord tones on the strong beats
  function judge(tune, notes) {
    const sc = new Set(scalePcs(tune.key, tune.mode)), chords = tune.degrees.map((d) => chord(tune.key, tune.mode, d.deg, d.flavour));
    let inScale = 0, strong = 0, strongTotal = 0;
    for (const n of notes) {
      if (sc.has(n.midi % 12)) inScale++;
      const bar = Math.floor(n.beat / 4) % chords.length, onStrong = Math.abs(n.beat % 4) < 0.26 || Math.abs((n.beat % 4) - 2) < 0.26;
      if (onStrong) { strongTotal++; if (chords[bar].pcs.includes(n.midi % 12)) strong++; }
    }
    return { count: notes.length, inScale: notes.length ? inScale / notes.length : 0, strong, strongTotal };
  }

  return { SHARP, FLAT, MODES, ROMAN, flatsFor, noteName, scalePcs, chord, voice, bassNote, freq, arrange, midiFile, judge };
})();
if (typeof module !== "undefined") module.exports = LearnTheory;
if (typeof window !== "undefined") window.LearnTheory = LearnTheory;

                h("p", {}, h("b", {}, g.name), " · ", LT.noteName(T.key, flats) + " " + LT.MODES[T.mode].name.toLowerCase() + " · " + T.tempo + " bpm · swing " + Math.round(T.swing * 100) + "%"),
                h("div", { class: "chips" }, chords.map((c) => h("span", { class: "chip " + c.fn }, c.roman + " " + c.name))),
                h("p", { class: "small dim", style: "margin-top:8px" }, T.melody.length + " melody notes recorded")),
              h("div", { class: "row", style: "margin-top:10px" }, h("button", { class: "big", "data-play": "1", onclick: () => (PL.on ? stop() : play({ melody: true })) }, "▶ PLAY"), h("button", { class: "big", id: "midi", onclick: () => { const n = downloadMidi(); toast("Saved a MIDI file (" + n + " bytes)"); } }, "⬇ DOWNLOAD MIDI"))),
            h("div", {},
              h("h3", {}, "The evening"),
              h("div", { class: "card" }, STAGES.map((n, i) => h("div", { class: "row", style: "padding:3px 0" }, h("b", { class: "chip", style: d[i] ? "background:var(--acc);color:#06251c" : "" }, d[i] ? "✓" : String(i + 1)), h("span", {}, n)))),
              h("button", { class: "big", id: "finish", style: "margin-top:12px;width:100%", disabled: !all && !cleared, onclick: finish }, cleared ? "EVENING FINISHED ✓ (AGAIN)" : "FINISH THE EVENING"),
              !all && !cleared ? h("p", { class: "lockmsg", style: "margin-top:8px" }, "Finish stages 1 to 5 first: each one has a small challenge.") : null)),
        ];
      }

      // ======================================================================
      // boot
      // ======================================================================
      $("#home").onclick = () => { S.genre = null; stop(); render(); };
      buildKb();
      render();

    </script>
